<!DOCTYPE html>
<html lang="en">
{% extends "index.html" %} {% block title %}Booking Page{% endblock %} 
{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Page</title>
    <link rel="stylesheet" href="/static/booking.css" />
</head>

<body>
    <form id="booking-form" method="POST" action="/BookingPage">
        <h1>Book an assessment!</h1>
        <p style="font-size: 25px;">Welcome to our booking page! Please select an assessor and date to make a reservation:</p>
        <ul style="list-style: none; padding: 0;">
            <li>
                <label for="assesor" style="font-size: 30px;">Select an assessor:</label>
                <select id="assesor" name="assesor" required>
                    <option value="">Select an assessor</option>
                    {% for assesor_name in assessors %}
                    <option value="{{ assesor_name }}">{{ assesor_name }}</option>
                    {% endfor %}
                </select>
            </li>
            <li>
                <label for="date">Select a date:</label>
                <input type="date" id="date" name="date" required>
                <input type="time" id="time" name="time" required>
            </li>
        </ul>
        <button type="submit">Book Now</button>
    </form>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('booking-form');
        
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const assesor = document.getElementById('assesor').value;
                    const date = document.getElementById('date').value;
                    const time = document.getElementById('time').value;
        
                    console.log('Assessor:', assesor);
                    console.log('Date:', date);
                    console.log('Time:', time);
        
                    if (!assesor || !date || !time) {
                        alert('Please fill in all fields before submitting.');
                        return;
                    }
        
                    const formAction = form.getAttribute('action');
                    const response = await fetch(formAction, {
                        method: 'POST',
                        body: new FormData(form)
                    });
        
                    if (!response.ok) {
                        const message = await response.text();
                        const overlay = document.createElement('div');
                        overlay.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(255,0,0,0.8); color:white; padding:15px; border-radius:5px; z-index:1000;';
                        overlay.textContent = message;
                        document.body.appendChild(overlay);
                        setTimeout(() => overlay.remove(), 3000);
                    } else {
                        window.location.href = '/booking_confirm';
                    }
                });
            }
        });
    </script>
</body>
{% endblock %}
</html>
