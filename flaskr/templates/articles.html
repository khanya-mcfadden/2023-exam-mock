<!DOCTYPE html>
<html lang="en">
{% extends "index.html" %}
{% block title %}Articles Page{% endblock %}
{% block content %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles Page</title>
    <link rel="stylesheet" href="/static/articles.css">
</head>

<body>
    <header>
        <h1 style="height: 100px; font-size: 50px; text-align: center;">
            <u>Articles</u>
        </h1>
    </header>

    <div class="container">
        <main>
            <div class="search-section">
                <label for="category">Filter by category:</label>
                <select id="category" name="category" onchange="filterArticles()">
                    <option value="all">All</option>
                    <option value="tech">Tech</option>
                    <option value="health">Health</option>
                    <option value="global weather">global weather</option>
                </select>
            </div>

            <div class="search">
                <label for="search">Search:</label>
                <input type="text" id="search" name="search" onkeyup="searchArticles()"
                    placeholder="Search for articles...">
            </div>

            <div id="new-articles">
                <h2>Top 3 Newest Articles</h2>
                <!-- Top 3 newest articles will be dynamically inserted here -->
            </div>

            <div id="articles">
                <h2>All Articles</h2>
                <!-- Articles will be dynamically inserted here -->
            </div>
        </main>

    </div>

    <script>
        const articles = [
            { title: "how to deal with the winter season part 1", synopsis: "test test", category: "health", date: "2023-10-02" },
            { title: "how to deal with the winter season part 2", synopsis: "test test", category: "health", date: "2023-10-01" },
            { title: "Ice caps are melting in new articles findings", synopsis: "test test", category: "global weather", date: "2023-10-03" },
            { title: "Global warming on the rise", synopsis: "test test", category: "global weather", date: "2023-10-04" }
        ];

        function displayArticles(filteredArticles, containerId) {
            const articlesDiv = document.getElementById(containerId);
            articlesDiv.innerHTML = '';
            filteredArticles.forEach(article => {
                const articleDiv = document.createElement('div');
                const articleLink = document.createElement('a');
                articleLink.href = `/articles/${article.title.replace(/\s+/g, '-').toLowerCase()}`;
                articleLink.textContent = article.title;
                const articleSynopsis = document.createElement('p');
                articleSynopsis.textContent = article.synopsis;
                articleDiv.appendChild(articleLink);
                articleDiv.appendChild(articleSynopsis);
                articlesDiv.appendChild(articleDiv);
            });
        }

        function filterArticles() {
            const category = document.getElementById('category').value;
            const filteredArticles = category === 'all' ? articles : articles.filter(article => article.category === category);
            displayArticles(filteredArticles, 'articles');
        }

        function searchArticles() {
            const searchQuery = document.getElementById('search').value.toLowerCase();
            const filteredArticles = articles.filter(article => article.title.toLowerCase().includes(searchQuery));
            displayArticles(filteredArticles, 'articles');
        }

        function displayTopNewestArticles() {
            const sortedArticles = articles.sort((a, b) => new Date(b.date) - new Date(a.date));
            const topNewestArticles = sortedArticles.slice(0, 3);
            displayArticles(topNewestArticles, 'new-articles');
            displayArticles(sortedArticles.slice(3), 'articles');
        }

        // Initial display of top 3 newest articles
        displayTopNewestArticles();
    </script>
</body>

</html>

{% endblock %}
