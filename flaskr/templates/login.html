<!DOCTYPE html>
<html lang="en">

{% extends "index.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<link rel="stylesheet" href="/static/login&SignUp.css" />

<div >
    <div class="container">
        <h1>Login</h1>
        <form action="/login" method="post">
            <!-- test inputs for login -->
            <div class="inputbox">
                <input type="text" name="username" placeholder="Username">
            </div>
            <div class="inputbox">
                <input type="password" name="password" placeholder="Password">
            </div>
            <!-- submit buton for login -->
            <div class="submitbtn">
                <input type="submit" value="login" class="loginbtn">
            </div>
            <!-- sign up info for login page -->
            <div>
                <br>
                <a href="/Sign-Up" style="color: #0098DB;">Don't have an account? Register</a>
            </div>
        </form>
    </div>
</div>
<script>
    // Form handling
    const form = document.querySelector('form');
    const submitBtn = document.getElementById('submitBtn');

    if (form) {
        form.addEventListener('input', () => {
            const isValid = form.checkValidity();
            if (submitBtn) {
                submitBtn.disabled = !isValid;
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formAction = form.getAttribute('action');
            const response = await fetch(formAction, {
                method: 'POST',
                body: new FormData(form)
            });

            if (!response.ok) {
                const message = await response.text();
                const overlay = document.createElement('div');
                overlay.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(255,0,0,0.8); color:white; padding:15px; border-radius:5px; z-index:1000;';
                overlay.textContent = message;
                document.body.appendChild(overlay);
                setTimeout(() => overlay.remove(), 3000);
            } else {
                window.location.href = '/';
            }
        });
    }

</script>

{% endblock %}

</html>
