<!DOCTYPE html>
<html lang="en">

<head>
    {% extends "index.html" %}
    <title>{% block title %}Weather Page{% endblock %}</title>
    <link rel="stylesheet" href="/static/weather.js">
</head>
{% block content %}

<body>
    <main>
        <h1>Weather Forecast</h1>
        <h2>Weather Forecast for the next 3 days</h2>

        <div class="location-search">
            <h2 style="font-size: 1.4rem;">for a new location type here: <span id="location"></span></h2>
            <form onsubmit="event.preventDefault(); updateLocation()">
                <input type="text" id="locationInput" placeholder="Enter city name">
                <button type="submit">Update Location</button>
            </form>
        </div>
        <br>

        <!-- displays current location -->
        <div class="find-location" style="font-size: 1.5rem;">
            <button id="find-me" style="font-size: 1.4rem;">Show my location</button><br />
            <p id="status"></p>
            <p id="city-name"></p>
            <a id="map-link" target="_blank"></a>
            <p id="lat-lon" style="display: none;"></p>
        </div>
        <div class="hid-location" style="font-size: 1.5rem; display: none;">
            <button id="hide-me" style="font-size: 1.4rem;">Hide my location</button><br />
        </div>

        <!-- toggle for latitude and longitude -->
        <div class="lat-lon-toggle" style="font-size: 1.4rem; margin-top: 20px;">
            <label for="lat-lon-checkbox" style="font-size: 1.4rem;">Show Latitude and Longitude</label>
            <input type="checkbox" id="lat-lon-checkbox" onchange="toggleLatLon()">
        </div>

        <!-- displays the weather api -->
        <div class="container1" style="display: flex; justify-content: center; align-items: center; min-height: 50px;">
            <div class="forecast" id="forecast">
            </div>
        </div>


        <footer style="background-color: #ffffff00; color: #000000; padding: 1rem;">
            <h5 style="color:#aaa;"> powered by
                <br>
                <a href="https://www.weatherapi.com" style="color: #39b6e837;">https://www.weatherapi.com</a>
            </h5>
        </footer>

        <!-- styling for page -->
        <style>
            .forecast {
                display: flex;
                justify-content: center;
                align-items: left;
            }

            .weather-card {
                background-color: white;
                margin: 10px;
                padding: 20px;
                width: 300px;
                border-radius: 10px;
                box-shadow: 0 0 5px #ffffff;
                text-align: center;
            }

            .weather-card img {
                width: 80px;
                height: 80px;
                margin: 10px auto;
            }

            .weather-card h2 {
                margin: 0;
                color: #333;
            }

            .weather-card p {
                margin: 10px 0;
                color: #666;
            }

            .container1 {
                width: 100%;
                max-width: 600px;
                margin: 20px auto;
                padding: 20px;
            }

            main {
                flex-grow: 1;
                /* Ensures the main content expands, pushing the footer down */
            }


            body {
                font-family: "Lato", sans-serif;
                display: flex;
                flex-direction: column;
                text-align: center;
                margin: 0;
            }

            footer {
                position: static;
                min-height: 0rem;
                /* Adjust this value as needed */
                left: 0;
                background: #ffffff;
                text-align: center;
                color: #000000;
            }
        </style>
    </main>
</body>
{% endblock %}

</html>
